name: Playwright Tests
on:
  push:
    branches: [ "Master" ]
  pull_request:
    branches: [ "Master" ]
  workflow_dispatch:  # Allows manual trigger
jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 
        
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build & Install
      run: dotnet build --configuration Debug

    - name: Install Allure CLI
      run: npm install -g allure-commandline --save-dev
      
    - name: Install browsers
      run: pwsh bin/Debug/net8.0/playwright.ps1 install --with-deps

    - name: Create allure-results directory
      run: mkdir -p allure-results
    
    - name: Run tests
      run: |
        echo "Current directory:"
        pwd
        echo "Directory contents before test:"
        ls -R
        dotnet test --settings e2e.runsettings --logger "trx;LogFileName=allure-report.trx" --results-directory "TestResults" -- NUnit.TestOutputXml=allure-results
      continue-on-error: true
      env:
        ALLURE_RESULTS_DIR: allure-results

    - name: List all files in repo after tests (debug)
      if: always()
      run: |
        echo "Directory contents after test:"
        ls -R

    - name: List screenshots in allure-results (debug)
      if: always()
      run: |
        Get-ChildItem -Path . -Filter *.png -Recurse | ForEach-Object { Write-Host $_.FullName }
        Get-ChildItem -Path . -Filter *.jpg -Recurse | ForEach-Object { Write-Host $_.FullName }
        if (Test-Path "allure-results") {
          Get-ChildItem -Path allure-results -Recurse | ForEach-Object { Write-Host $_.FullName }
        }
        if (Test-Path "TestResults") {
          Get-ChildItem -Path TestResults -Recurse | ForEach-Object { Write-Host $_.FullName }
        }

    - name: Copy screenshots to allure-results
      if: always()
      run: |
        if (Test-Path "TestResults") {
          Get-ChildItem -Path TestResults -Filter *.png -Recurse | ForEach-Object {
            Copy-Item $_.FullName -Destination allure-results -Force
            Write-Host "Copied screenshot: $($_.Name)"
          }
        }
        # Also check for screenshots in bin directory
        if (Test-Path "bin") {
          Get-ChildItem -Path bin -Filter *.png -Recurse | ForEach-Object {
            Copy-Item $_.FullName -Destination allure-results -Force
            Write-Host "Copied screenshot from bin: $($_.Name)"
          }
        }

    - name: Prepare Allure history for trend
      if: always()
      run: |
        git clone --branch gh-pages --single-branch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages-history
        if (Test-Path "gh-pages-history\history") {
          if (-not (Test-Path "allure-results\history")) {
            New-Item -ItemType Directory -Path "allure-results\history" -Force
          }
          Copy-Item -Path "gh-pages-history\history\*" -Destination "allure-results\history" -Recurse -Force
        }

    - name: Generate Allure Report
      if: always()
      run: |
        allure generate allure-results --clean -o allure-report

    - name: Upload Allure Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report

    - name: Debug - Check allure-report contents
      if: always()
      run: |
        if (Test-Path "allure-report") {
          Write-Host "Allure report directory contents:"
          Get-ChildItem -Path "allure-report" -Recurse | ForEach-Object { Write-Host $_.FullName }
        } else {
          Write-Host "Allure report directory not found!"
        }

    - name: Deploy to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
        publish_branch: gh-pages
        keep_files: false
        force_orphan: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: 'Deploy Allure report ${{ github.sha }}'
