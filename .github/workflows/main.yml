name: Playwright Tests
on:
  push:
    branches: [ "Master" ]
  pull_request:
    branches: [ "Master" ]
  workflow_dispatch:  # Allows manual trigger
jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 
        
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build & Install
      run: dotnet build --configuration Debug

    - name: Install Allure CLI
      run: npm install -g allure-commandline --save-dev
      
    - name: Install browsers
      run: pwsh bin/Debug/net8.0/playwright.ps1 install --with-deps

    - name: Create allure-results directory
      run: |
        if (-not (Test-Path "allure-results")) {
          New-Item -ItemType Directory -Path "allure-results" -Force
        }
    
    - name: Run tests
      run: |
        Write-Host "Current directory:"
        Get-Location
        Write-Host "Directory contents before test:"
        Get-ChildItem -Recurse | Select-Object FullName
        dotnet test --settings e2e.runsettings --logger "trx;LogFileName=allure-report.trx" --results-directory "TestResults" -- NUnit.TestOutputXml=allure-results
      continue-on-error: true
      env:
        ALLURE_RESULTS_DIR: allure-results

    - name: List all files in repo after tests (debug)
      if: always()
      run: |
        Write-Host "Directory contents after test:"
        Get-ChildItem -Recurse | Select-Object FullName

    - name: List screenshots in allure-results (debug)
      if: always()
      run: |
        Get-ChildItem -Path . -Filter *.png -Recurse | ForEach-Object { Write-Host $_.FullName }
        Get-ChildItem -Path . -Filter *.jpg -Recurse | ForEach-Object { Write-Host $_.FullName }
        if (Test-Path "allure-results") {
          Get-ChildItem -Path allure-results -Recurse | ForEach-Object { Write-Host $_.FullName }
        }
        if (Test-Path "TestResults") {
          Get-ChildItem -Path TestResults -Recurse | ForEach-Object { Write-Host $_.FullName }
        }

    - name: Copy screenshots to allure-results
      if: always()
      run: |
        if (Test-Path "TestResults") {
          Get-ChildItem -Path TestResults -Filter *.png -Recurse | ForEach-Object {
            Copy-Item $_.FullName -Destination allure-results -Force
            Write-Host "Copied screenshot: $($_.Name)"
          }
        }
        # Also check for screenshots in bin directory
        if (Test-Path "bin") {
          Get-ChildItem -Path bin -Filter *.png -Recurse | ForEach-Object {
            Copy-Item $_.FullName -Destination allure-results -Force
            Write-Host "Copied screenshot from bin: $($_.Name)"
          }
        }

    - name: Prepare Allure history for trend
      if: always()
      run: |
        git clone --branch gh-pages --single-branch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages-history
        if (Test-Path "gh-pages-history\history") {
          if (-not (Test-Path "allure-results\history")) {
            New-Item -ItemType Directory -Path "allure-results\history" -Force
          }
          Copy-Item -Path "gh-pages-history\history\*" -Destination "allure-results\history" -Recurse -Force
          Write-Host "History copied successfully"
        } else {
          Write-Host "No previous history found"
        }

    - name: Generate Allure Report
      if: always()
      run: |
        allure generate allure-results --clean -o allure-report

    - name: Upload Allure Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report

    - name: Debug - Check allure-report contents
      if: always()
      run: |
        if (Test-Path "allure-report") {
          Write-Host "Allure report directory contents:"
          Get-ChildItem -Path "allure-report" -Recurse | ForEach-Object { Write-Host $_.FullName }
        } else {
          Write-Host "Allure report directory not found!"
        }

    - name: Deploy to GitHub Pages (Windows)
      if: always()
      run: |
        # Configure git
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        
        # Clone or create gh-pages branch
        $repoUrl = "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        
        if (git ls-remote --heads $repoUrl gh-pages) {
          Write-Host "Cloning existing gh-pages branch..."
          git clone --branch gh-pages --single-branch $repoUrl gh-pages-deploy
        } else {
          Write-Host "Creating new gh-pages branch..."
          git clone $repoUrl gh-pages-deploy
          Set-Location gh-pages-deploy
          git checkout --orphan gh-pages
          git rm -rf .
          Set-Location ..
        }
        
        # Clean and copy new content
        if (Test-Path "gh-pages-deploy") {
          # Remove all files except .git and history
          Get-ChildItem -Path "gh-pages-deploy" -Exclude ".git" | Remove-Item -Recurse -Force
          
          # Copy new report
          if (Test-Path "allure-report") {
            Copy-Item -Path "allure-report\*" -Destination "gh-pages-deploy" -Recurse -Force
            Write-Host "Report copied to gh-pages-deploy"
          }
          
          # Commit and push
          Set-Location gh-pages-deploy
          git add .
          $commitMessage = "Update Allure report - $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          
          if (git diff --staged --quiet) {
            Write-Host "No changes to commit"
          } else {
            git commit -m $commitMessage
            git push origin gh-pages --force
            Write-Host "Report deployed successfully"
          }
        } else {
          Write-Host "Failed to create gh-pages-deploy directory"
        }
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}